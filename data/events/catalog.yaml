  - event_id: fed-rate-hike-2026-09-16
    category_id: banking-liquidity
    title: Federal Reserve rate increase and financial-sector repricing
    summary: The Federal Reserve raised its target range on September 16, 2026, creating a recent policy window for comparing the event-day response in JPMorgan, Goldman Sachs, Schwab, and broad financial-sector trading with contextual evidence through September 18.
    sort_order: 1
    event_session: "2026-09-16"
    source_dates: ["2026-09-16"]
    primary_ticker: JPM
    analysis_tickers: [JPM, GS, SCHW]
    context_instruments: [XLF, SPY]
    start_session: "2026-09-11"
    end_session: "2026-09-18"
    default_cutoff: "2026-09-18T20:00:00Z"
    questions:
      - question_id: fed-hike-financials-move
        label: Measure the financial response
        capability: move-measurement
        text: How did JPMorgan trade on the Federal Reserve's September 16, 2026 rate-increase session relative to Goldman Sachs, Schwab, XLF, and SPY?
      - question_id: fed-hike-policy-evidence
        label: Review the policy evidence
        capability: evidence-review
        text: What did cutoff-qualified Federal Reserve source evidence say about the September 16, 2026 decision, what measured JPMorgan reaction can it support, and what remains uncertain about causality?
      - question_id: fed-hike-financials-ranking
        label: Rank the financial response
        capability: peer-comparison
        text: Rank JPMorgan, Goldman Sachs, and Schwab separately by their September 16, 2026 event-session return and volume ratio, identify the most extreme response under each measure, and compare it against XLF and SPY.
      - question_id: fed-hike-financials-analogues
        label: Find historical analogues
        capability: historical-analogues
        text: Which prior observations across the validated universe most closely resemble JPMorgan's measured September 16, 2026 response in absolute-return magnitude and volume ratio, and where do those comparisons break down?
    source_requirements:
      market: {required: true, required_fields: [adjusted_close, volume], price_basis: provider_adjusted}
      documents: {required_for_ready: true, requirement_id: fed-primary-2026-09-16, source_kinds: [primary_source]}
      licensed_news: {required_for_publication: false, required_for_ready: true, source_kind: licensed_news_metadata}
      derived_features: {required_for_ready: true, features: [historical-analogues]}
    known_gaps: []
    limitations:
      - limitation_id: reconstructed-market-history
        detail: Market history is a later reconstruction and does not prove what a user could retrieve at the original cutoff.
      - limitation_id: public-authority-source-scope
        detail: The Federal Reserve statement is primary evidence for the policy decision, not JPMorgan-authored evidence or proof of any single stock's causal driver; the curated news context is selective.

