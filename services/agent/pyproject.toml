[build-system]
requires=["setuptools==80.9.0"]
build-backend="setuptools.build_meta"
[project]
name="market-agent"
version="0.1.0"
requires-python=">=3.12"
dependencies=[
  "fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1", "mcp==2.2.0", "cryptography==50.0.1",
  "langgraph==1.2.11", "langgraph-checkpoint-sqlite==3.1.1", "aiosqlite==0.22.1",
  "deepagents==0.7.15", "langchain-openai==1.6.2", "nemo-relay[deepagents]==0.9.0rc3",
  "nemo-switchyard==0.3.0", "langchain-nvidia-switchyard==0.1.0",
]
[tool.setuptools.packages.find]
where=["src"]
include=["market_agent*"]
[tool.setuptools.package-data]
market_agent=["prompts/*.md"]

[tool.uv.sources]
nemo-switchyard = { git = "https://github.com/NVIDIA-NeMo/Switchyard.git", rev = "1759dfdff95ed2718f6dd2afef6541654bbd0116" }
langchain-nvidia-switchyard = { git = "https://github.com/langchain-ai/langchain-nvidia.git", rev = "9aa3de853238aa0bcddb799c733a2e189e98078f", subdirectory = "libs/switchyard" }
