[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "market-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "pydantic-settings==2.7.1", "mcp==2.2.0"]
[tool.setuptools.packages.find]
where = ["src"]
