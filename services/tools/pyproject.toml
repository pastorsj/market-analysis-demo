[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "market-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "uvicorn==0.52.4"]  # GPU libraries come from base.Dockerfile
[tool.setuptools.packages.find]
where = ["src"]
