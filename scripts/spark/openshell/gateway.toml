[openshell]
version = 2

[openshell.gateway]
name = "market-shock"
# Loopback only. TLS, client-certificate (mTLS) user authentication, and
# gateway-minted sandbox JWTs come from the package-managed local TLS
# directory (OPENSHELL_LOCAL_TLS_DIR), as in the upstream systemd unit.
bind_address = "127.0.0.1:17671"
log_level = "info"
compute_driver = "docker"
policy_validation_failure_mode = "fail_closed"
# The browser reaches the agent through web's /api proxy, never a service URL.
enable_loopback_service_http = false

[openshell.drivers.docker]
socket_path = "/var/run/docker.sock"
sandbox_label = "market-shock"
image_pull_policy = "never"
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:0.1.2"
supervisor_image = "ghcr.io/nvidia/openshell/supervisor:0.1.2"
sandbox_pids_limit = 512
# The operator mounts only selected app data/state paths (see
# openshell_runtime.py). No Docker socket, home directory, repository, or
# OpenShell control state enters the agent. Raw host bind mounts have no label
# resolver, so OpenShell requires admission to be disabled for them.
allow_driver_config = true
enable_bind_mounts = true

[openshell.drivers.docker.resource_admission]
enabled = false
