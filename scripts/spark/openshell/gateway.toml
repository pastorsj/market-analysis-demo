[openshell]
version = 1

[openshell.gateway]
name = "market-shock"
bind_address = "127.0.0.1:17671"
log_level = "info"
compute_drivers = ["docker"]
disable_tls = true
policy_validation_failure_mode = "fail_closed"

[openshell.gateway.gateway_jwt]
signing_key_path = "/srv/market-shock/openshell/keys/signing.pem"
public_key_path = "/srv/market-shock/openshell/keys/public.pem"
kid_path = "/srv/market-shock/openshell/keys/kid"
gateway_id = "market-shock"
ttl_secs = 0

[openshell.gateway.auth]
# Workstation-local control API only; bridge callback listener is sandbox-only.
allow_unauthenticated_users = true

[openshell.drivers.docker]
network_name = "market-shock_openshell"
sandbox_namespace = "market-shock"
image_pull_policy = "Never"
supervisor_bin = "/srv/market-shock/openshell/0.0.116/openshell-sandbox"
grpc_endpoint = "http://host.openshell.internal:17671"
# Only selected app data/state paths are mounted by the operator. No Docker
# socket, home directory, repository or OpenShell control state enters the agent.
enable_bind_mounts = true
sandbox_pids_limit = 512
