version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /opt/market-agent
    - /srv/market-shock/scenario
    - /srv/market-shock/events
  read_write:
    - /tmp
    - /dev/null
    - /srv/market-shock/state
    - /srv/market-shock/traces
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
# host.openshell.internal is the OpenShell Docker driver's reserved alias for
# the gateway host; tools and model are published there on loopback only.
# Remote inference and LangSmith access come from attached provider profiles.
network_policies:
  tools:
    name: market-tools
    endpoints:
      - host: host.openshell.internal
        port: 8000
        path: /mcp
        protocol: mcp
        enforcement: enforce
        rules:
          - allow: {method: initialize}
          - allow: {method: notifications/initialized}
          - allow: {method: ping}
          # The MCP client lists tools to validate structured results before calls.
          - allow: {method: tools/list}
          - allow: {method: resources/read}
          - allow:
              method: tools/call
              tool:
                any:
                  - get_price_context
                  - detect_market_shock
                  - find_historical_analogues
                  - map_comovement
                  - predict_volatility_risk
                  - search_news
                  - project_news_topics
    binaries:
      - path: /usr/local/bin/python3.12
  local_model:
    name: approved-local-nemotron
    endpoints:
      - host: host.openshell.internal
        port: 8001
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /v1/chat/completions}
          - allow: {method: GET, path: /v1/models}
    binaries:
      - path: /usr/local/bin/python3.12
