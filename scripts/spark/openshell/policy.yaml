version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /opt/market-agent
    - /srv/market-shock/scenario
    - /srv/market-shock/events
  read_write:
    - /tmp
    - /dev/null
    - /srv/market-shock/state
    - /srv/market-shock/traces
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  tools:
    name: market-tools
    endpoints:
      - host: tools
        port: 8000
        protocol: rest
        enforcement: enforce
        rules:
          - {allow: {method: GET, path: /mcp}}
          - {allow: {method: POST, path: /mcp}}
          - {allow: {method: DELETE, path: /mcp}}
          - {allow: {method: GET, path: /health}}
    binaries:
      - {path: /usr/local/bin/python3.12}
  local_model:
    name: approved-local-nemotron
    endpoints:
      - host: model
        port: 8001
        protocol: rest
        enforcement: enforce
        rules:
          - {allow: {method: POST, path: /v1/chat/completions}}
          - {allow: {method: GET, path: /v1/models}}
          - {allow: {method: GET, path: /health}}
    binaries:
      - {path: /usr/local/bin/python3.12}
