name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uvx ruff@0.15.0 check scripts tests
      - run: uvx ruff@0.15.0 format --check services scripts tests
      - run: >-
          uv run --project services/agent --with pytest --with pytest-asyncio --with numpy
          pytest -q tests/agent tests/unit tests/tools
        env:
          PYTHONPATH: services/agent/src:services/tools/src:.

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web test -- --run
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web build
